# Builds a Foxy debug APK inside the fork — no pull request needed.
#
# Run it: Actions ▸ "Build Foxy APK" ▸ Run workflow.
# Then open the finished run and download "foxy-debug-apk" from Artifacts.
#
# Notes
#   * Uses the Android SDK that already ships with the GitHub runner and installs
#     only the pieces this project pins (platform 35, build-tools 35.0.0,
#     NDK 26.3.11579264, CMake 3.22.1). The android-actions/setup-android step is
#     deliberately avoided: it runs `sdkmanager tools`, and Google removed that
#     package, which made the step fail on current runner images.
#   * If a patch exists under .github/patches/*.patch it is applied to the
#     checkout first (git am, falling back to git apply --3way). The commit is
#     only made inside CI; the branch itself is untouched.

name: Build Foxy APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/patches/**.patch"
      - ".github/workflows/build-foxy-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-foxy-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (if present)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.github/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patch under .github/patches — building the checkout as-is."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for patch in "${patches[@]}"; do
            echo "::group::Applying $patch"
            if ! git am --keep-cr "$patch"; then
              echo "git am failed, retrying with 'git apply --3way'"
              git am --abort || true
              git apply --3way --whitespace=nowarn "$patch"
            fi
            echo "::endgroup::"
          done
          echo "Applied ${#patches[@]} patch(es):"
          git log --oneline -n 5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"
          echo "--- NDK ---"
          ls "$ANDROID_HOME/ndk" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare local.properties
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build release APK (signed)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          # A release build signed with the project key: the debug-signed APK was the reason
          # Google Play Protect refused to install it.
          test -f signing.properties || { echo "signing.properties is missing"; exit 1; }
          test -f uac-release.jks || { echo "the release keystore is missing"; exit 1; }
          ./gradlew :app:assembleRelease \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-apk
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out-apk/ \;
          test -n "$(ls -A out-apk)" || { echo "no release APK was produced"; exit 1; }
          ls -lh out-apk
          {
            echo "### Foxy release build (signed)"
            echo ""
            echo "| APK | Size |"
            echo "|---|---|"
            for f in out-apk/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Commit built: \`$(git rev-parse --short HEAD)\` — $(git log -1 --pretty=%s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: foxy-release-apk
          path: out-apk/*.apk
          if-no-files-found: error
          retention-days: 30
