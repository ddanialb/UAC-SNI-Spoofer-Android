# Builds a Foxy debug APK inside your fork — no pull request needed.
#
# How it works
#   * If a patch exists under .github/patches/*.patch it is applied to the checkout first
#     (git am, falling back to git apply --3way). Your branch stays untouched: the patch
#     only lives inside the CI workspace.
#   * If there is no patch, the workflow simply builds whatever is committed.
#   * The APKs (per-ABI + universal debug) are uploaded as a downloadable artifact.
#
# Run it: Actions ▸ "Build Foxy APK" ▸ Run workflow. Then open the finished run and
# download "foxy-debug-apk" from the Artifacts section at the bottom of the page.

name: Build Foxy APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/patches/**.patch"
      - ".github/workflows/build-foxy-apk.yml"

permissions:
  contents: read

concurrency:
  group: build-foxy-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch (if present)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          patches=(.github/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patch under .github/patches — building the checkout as-is."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for patch in "${patches[@]}"; do
            echo "::group::Applying $patch"
            if ! git am --keep-cr "$patch"; then
              echo "git am failed, retrying with 'git apply --3way'"
              git am --abort || true
              git apply --3way --whitespace=nowarn "$patch"
            fi
            echo "::endgroup::"
          done
          echo "Applied ${#patches[@]} patch(es):"
          git log --oneline -n 5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare local.properties
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out-apk
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} out-apk/ \;
          ls -lh out-apk
          {
            echo "### Foxy debug build"
            echo ""
            echo "| APK | Size |"
            echo "|---|---|"
            for f in out-apk/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo "Commit built: $(git rev-parse --short HEAD) — $(git log -1 --pretty=%s)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: foxy-debug-apk
          path: out-apk/*.apk
          if-no-files-found: error
          retention-days: 30
